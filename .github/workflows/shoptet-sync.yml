name: Shoptet → štítkovačka (sync + ping DB)

on:
  schedule:
    - cron: "0 5 * * *"      # denně 05:00 UTC = 07:00 Praha (léto), 06:00 (zima)
  workflow_dispatch:         # ruční spuštění z GitHubu / API
    inputs:
      test_mail:
        description: "Jen poslat testovací mail (neřeší produkty)"
        type: boolean
        default: false
      bez_mailu:
        description: "Zapsat do databáze, ale mail neposílat"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pillow: sync importuje Scripts/label_printer.py (klasifikace dovozce), který ho načítá
      - run: pip install --quiet pandas openpyxl pillow

      - name: Synchronizace
        env:
          SHOPTET_EXPORT_URL: ${{ secrets.SHOPTET_EXPORT_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python sync/shoptet_sync.py ${{ inputs.test_mail == true && '--test-mail' || '' }} ${{ inputs.bez_mailu == true && '--bez-mailu' || '' }}

      # Běží VŽDY (i když sync spadne): Supabase projekt je na Free plánu a po
      # 7 dnech bez jediného API dotazu by se uspal (probouzí se jen ručně
      # v dashboardu). Sync se DB dotýká až po stažení Shoptet exportu, takže
      # ve dnech, kdy Shoptet neodpoví, by dotaz chyběl – tohle ho zaručí.
      - name: Ping Supabase (udržet projekt vzhůru)
        if: always()
        run: |
          K=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zaW5semFnamlteXJ6anBkeGFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDUzMDcsImV4cCI6MjA5NzE4MTMwN30.aWkcUv9jpwbqQ3fSHZ_damRGwSqxC_YtH3siySoMgq4
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://osinlzagjimyrzjpdxai.supabase.co/rest/v1/products?select=code&limit=1" \
            -H "apikey: $K" -H "Authorization: Bearer $K")
          echo "Supabase odpověděla HTTP $code"
          test "$code" = "200"

      - name: Uložit XLSX k běhu (i když mail neodešel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-do-shoptetu
          path: vystup/
          if-no-files-found: ignore
          retention-days: 90
